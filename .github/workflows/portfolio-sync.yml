name: Governed portfolio sync

# Daily at 03:17 UTC, plus manual dispatch. The schedule was restored in
# AUTO-04D after AUTO-04C certified the review-PR delivery path.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

# Native token is read-only. A repository-scoped App token is minted only when
# material review evidence changes and is used only for review delivery.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: governed-portfolio-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PCGsoft site
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install site dependencies only
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Run deterministic sync check
        id: sync-check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-portfolio.mjs --check

      - name: Write derived reconciliation artefacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-portfolio.mjs --write --report-json docs/portfolio-sync/portfolio-sync-report.json

      - name: Validate and build
        run: |
          npm run validate
          npm run build
          git diff --check

      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f docs/portfolio-sync/portfolio-sync-report.md ]; then
            cat docs/portfolio-sync/portfolio-sync-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compare material review evidence
        id: review-change
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/compare-portfolio-review.mjs

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: portfolio-sync-report
          retention-days: 90
          archive: true
          if-no-files-found: error
          path: |
            docs/portfolio-sync/portfolio-sync-report.md
            docs/portfolio-sync/portfolio-sync-report.json
            data/generated/github-portfolio-snapshot.json
            data/generated/portfolio-sync-report.json
            data/generated/portfolio-review-evidence.json

      - name: Mint App token for review delivery
        id: app-token
        if: steps.review-change.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.PCGSOFT_SYNC_APP_ID }}
          private-key: ${{ secrets.PCGSOFT_SYNC_APP_PRIVATE_KEY }}
          owner: hourwise
          repositories: pcgsoft-site
          permission-contents: write
          permission-pull-requests: write

      - name: Resolve App bot commit identity
        id: app-bot
        if: steps.review-change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          if [[ ! "$APP_SLUG" =~ ^[a-z0-9-]+$ ]]; then
            echo "Invalid App slug" >&2
            exit 1
          fi
          bot_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          if [[ ! "$bot_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid App bot ID" >&2
            exit 1
          fi
          printf 'git-identity=%s[bot] <%s+%s[bot]@users.noreply.github.com>\n' \
            "$APP_SLUG" "$bot_id" "$APP_SLUG" >> "$GITHUB_OUTPUT"

      # One stable branch and one PR: an existing open PR on this branch is
      # updated, and an unchanged report produces no new commit or push.
      - name: Create or update one review PR
        id: review-pr
        if: steps.review-change.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch-token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.app-bot.outputs.git-identity }}
          committer: ${{ steps.app-bot.outputs.git-identity }}
          branch: automation/portfolio-sync
          delete-branch: false
          add-paths: |
            data/generated/github-portfolio-snapshot.json
            data/generated/portfolio-sync-report.json
            docs/portfolio-sync/portfolio-sync-report.json
            docs/portfolio-sync/portfolio-sync-report.md
          title: "chore(portfolio): governed reconciliation report"
          commit-message: "chore(portfolio): update governed reconciliation report"
          body: |
            Generated by the Governed portfolio sync workflow. Review evidence only.

            This PR contains deterministic generated reconciliation evidence only:
            safe public GitHub facts, and manifest proposals pinned to a source
            repository commit and blob SHA, reconciled field by field against the
            canonical registry.

            Discovery and manifests are not publication authority. Unmapped
            repositories, provenance and eligibility findings, canonical conflicts
            and uncomparable fields remain in the report for human review. No
            project pages, sitemap entries or canonical registry records are
            changed by this workflow.

            A human approval is required before merge. The workflow never
            approves or merges this PR.

            This branch records the last material review change. Every run retains
            fresh observation SHAs in its portfolio-sync-report artifact for 90 days.
            HEAD-only changes with identical material evidence do not update this PR.

      - name: Record review-PR outcome
        if: always()
        run: |
          {
            echo "## Review PR"
            echo "- operation: ${{ steps.review-pr.outputs.pull-request-operation || 'none' }}"
            echo "- number: ${{ steps.review-pr.outputs.pull-request-number || steps.review-change.outputs.number || 'n/a' }}"
            echo "- head SHA: ${{ steps.review-pr.outputs.pull-request-head-sha || steps.review-change.outputs.head || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
