name: Governed portfolio sync

# Daily at 03:17 UTC, plus manual dispatch. The schedule was restored in
# AUTO-04D after AUTO-04C certified the review-PR delivery path.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

# Minimum needed to push the generated review branch and open or update its PR.
# Every other GITHUB_TOKEN permission is none. The workflow never approves or
# merges; the main ruleset requires a human approval.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: governed-portfolio-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PCGsoft site
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install site dependencies only
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Run deterministic sync check
        id: sync-check
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-portfolio.mjs --check

      - name: Write derived reconciliation artefacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-portfolio.mjs --write --report-json docs/portfolio-sync/portfolio-sync-report.json

      - name: Validate and build
        run: |
          npm run validate
          npm run build
          git diff --check

      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f docs/portfolio-sync/portfolio-sync-report.md ]; then
            cat docs/portfolio-sync/portfolio-sync-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reconciliation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-sync-report
          path: |
            docs/portfolio-sync/portfolio-sync-report.md
            docs/portfolio-sync/portfolio-sync-report.json
            data/generated/github-portfolio-snapshot.json
            data/generated/portfolio-sync-report.json

      # One stable branch and one PR: an existing open PR on this branch is
      # updated, and an unchanged report produces no new commit or push.
      - name: Create or update one review PR
        id: review-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/portfolio-sync
          delete-branch: false
          add-paths: |
            data/generated/github-portfolio-snapshot.json
            data/generated/portfolio-sync-report.json
            docs/portfolio-sync/portfolio-sync-report.json
            docs/portfolio-sync/portfolio-sync-report.md
          title: "chore(portfolio): governed reconciliation report"
          commit-message: "chore(portfolio): update governed reconciliation report"
          body: |
            Generated by the Governed portfolio sync workflow. Review evidence only.

            This PR contains deterministic generated reconciliation evidence only:
            safe public GitHub facts, and manifest proposals pinned to a source
            repository commit and blob SHA, reconciled field by field against the
            canonical registry.

            Discovery and manifests are not publication authority. Unmapped
            repositories, provenance and eligibility findings, canonical conflicts
            and uncomparable fields remain in the report for human review. No
            project pages, sitemap entries or canonical registry records are
            changed by this workflow.

            A human approval is required before merge. The workflow never
            approves or merges this PR.

      - name: Record review-PR outcome
        if: always()
        run: |
          {
            echo "## Review PR"
            echo "- operation: ${{ steps.review-pr.outputs.pull-request-operation || 'none' }}"
            echo "- number: ${{ steps.review-pr.outputs.pull-request-number || 'n/a' }}"
            echo "- head SHA: ${{ steps.review-pr.outputs.pull-request-head-sha || 'n/a' }}"
          } >> "$GITHUB_STEP_SUMMARY"
